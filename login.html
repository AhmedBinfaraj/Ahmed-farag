<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F6; --card:#FFFFFF; --ink:#16213A; --muted:#5B6479; --line:#CBD2E0;
  --brand:#2B3FD6; --brand-ink:#FFFFFF; --panel:#16213A; --panel-ink:#F3F5FA; --panel-soft:#A9B4D0;
  --err:#B3261E; --ok:#17794B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1424; --card:#161E33; --ink:#EDF0F8; --muted:#A3ADC4; --line:#2E3956;
    --brand:#7F90FF; --brand-ink:#0E1424; --panel:#0A0F1C; --panel-ink:#EDF0F8; --panel-soft:#8793B2;
    --err:#FF8A80; --ok:#6FD6A0;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1424; --card:#161E33; --ink:#EDF0F8; --muted:#A3ADC4; --line:#2E3956;
  --brand:#7F90FF; --brand-ink:#0E1424; --panel:#0A0F1C; --panel-ink:#EDF0F8; --panel-soft:#8793B2;
  --err:#FF8A80; --ok:#6FD6A0;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7}
.wrap{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.form-side{display:flex;align-items:center;justify-content:center;padding:32px 24px}
.box{width:100%;max-width:400px}
h1{font-size:2rem;line-height:1.3;margin:0 0 8px;font-weight:700}
.sub{margin:0 0 28px;color:var(--muted)}
.field{margin-bottom:18px}
label{display:block;font-weight:500;margin-bottom:6px}
.input{position:relative}
input[type=email],input[type=password],input[type=text]{
  width:100%;padding:12px 14px;font:inherit;color:var(--ink);background:var(--card);
  border:1.5px solid var(--line);border-radius:10px}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
input[aria-invalid=true]{border-color:var(--err)}
.pw input{padding-inline-end:76px}
.toggle{position:absolute;inset-block:6px;inset-inline-end:6px;border:0;background:transparent;
  color:var(--brand);font:inherit;font-weight:500;cursor:pointer;padding:0 10px;border-radius:8px}
.msg{min-height:1.4em;margin:4px 0 0;font-size:.9rem;color:var(--err)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 22px;flex-wrap:wrap}
.check{display:flex;align-items:center;gap:8px;font-weight:400;margin:0;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--brand)}
a{color:var(--brand);text-decoration:none;font-weight:500}
a:hover{text-decoration:underline}
.submit{width:100%;padding:13px;border:0;border-radius:10px;background:var(--brand);color:var(--brand-ink);
  font:inherit;font-weight:700;font-size:1.05rem;cursor:pointer}
.submit:disabled{opacity:.6;cursor:progress}
.status{margin-top:14px;min-height:1.4em;text-align:center;color:var(--ok);font-weight:500}
.alt{margin-top:22px;text-align:center;color:var(--muted)}
.panel{background:var(--panel);color:var(--panel-ink);display:flex;flex-direction:column;justify-content:flex-end;padding:48px}
.panel p.big{font-size:clamp(2rem,3.6vw,3.2rem);line-height:1.35;font-weight:700;margin:0 0 16px;max-width:15ch}
.panel p.small{margin:0;color:var(--panel-soft);max-width:34ch}
@media (max-width:820px){
  .wrap{grid-template-columns:1fr}
  .panel{display:none}
  .form-side{align-items:flex-start;padding-top:56px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <main class="form-side">
    <div class="box">
      <h1>تسجيل الدخول</h1>
      <p class="sub">ادخل بياناتك علشان تكمّل من حيث وقفت.</p>

      <form id="f" novalidate>
        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <div class="input"><input id="email" type="email" inputmode="email" autocomplete="email" dir="ltr" placeholder="name@example.com" required></div>
          <p class="msg" id="e-email" role="alert"></p>
        </div>

        <div class="field">
          <label for="pw">كلمة المرور</label>
          <div class="input pw">
            <input id="pw" type="password" autocomplete="current-password" dir="ltr" required>
            <button type="button" class="toggle" id="t" aria-controls="pw" aria-pressed="false">إظهار</button>
          </div>
          <p class="msg" id="e-pw" role="alert"></p>
        </div>

        <div class="row">
          <label class="check"><input type="checkbox" id="rem"> تذكّرني</label>
          <a href="#forgot">نسيت كلمة المرور؟</a>
        </div>

        <button class="submit" id="go" type="submit">تسجيل الدخول</button>
        <div class="status" id="s" role="status" aria-live="polite"></div>
      </form>

      <p class="alt">ليس لديك حساب؟ <a href="#signup">إنشاء حساب جديد</a></p>
    </div>
  </main>

  <aside class="panel" aria-hidden="true">
    <p class="big">كل خطوة تبنيها اليوم تُحسب لك غدًا.</p>
    <p class="small">سجّل دخولك وكمّل شغلك من نفس النقطة.</p>
  </aside>
</div>

<script>
(function(){
  var f=document.getElementById('f'), em=document.getElementById('email'), pw=document.getElementById('pw'),
      ee=document.getElementById('e-email'), ep=document.getElementById('e-pw'),
      s=document.getElementById('s'), go=document.getElementById('go'), t=document.getElementById('t'),
      rem=document.getElementById('rem');

  try{ var saved=localStorage.getItem('login-email'); if(saved){ em.value=saved; rem.checked=true; } }catch(e){}

  t.addEventListener('click',function(){
    var show=pw.type==='password';
    pw.type=show?'text':'password';
    t.textContent=show?'إخفاء':'إظهار';
    t.setAttribute('aria-pressed',String(show));
  });

  function check(){
    var ok=true, v=em.value.trim();
    ee.textContent=''; ep.textContent='';
    em.removeAttribute('aria-invalid'); pw.removeAttribute('aria-invalid');
    if(!v){ ee.textContent='اكتب بريدك الإلكتروني.'; em.setAttribute('aria-invalid','true'); ok=false; }
    else if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)){ ee.textContent='البريد غير صحيح. مثال: name@example.com'; em.setAttribute('aria-invalid','true'); ok=false; }
    if(!pw.value){ ep.textContent='اكتب كلمة المرور.'; pw.setAttribute('aria-invalid','true'); ok=false; }
    else if(pw.value.length<8){ ep.textContent='كلمة المرور لازم تكون 8 أحرف على الأقل.'; pw.setAttribute('aria-invalid','true'); ok=false; }
    return ok;
  }

  f.addEventListener('submit',function(e){
    e.preventDefault(); s.textContent='';
    if(!check()){ (f.querySelector('[aria-invalid=true]')||em).focus(); return; }
    try{ if(rem.checked) localStorage.setItem('login-email',em.value.trim()); else localStorage.removeItem('login-email'); }catch(x){}
    go.disabled=true; go.textContent='جارٍ تسجيل الدخول…';
    // Demo only: replace this timeout with a real request to your backend.
    setTimeout(function(){
      go.disabled=false; go.textContent='تسجيل الدخول';
      s.textContent='تم تسجيل الدخول بنجاح.';
    },900);
  });
})();
</script>
</body>
</html>
